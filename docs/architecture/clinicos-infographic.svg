<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ClinicOS — Patient to Payment</title>
<desc id="desc">Five stages from intake to payment. Patients use Telegram. Admins and doctors use Care Board. n8n coordinates workflows with Supabase Auth, PostgreSQL and private Storage. Ollama drafts summaries for doctor review.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f43a8"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#566689"/></marker>
</defs>
<style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#161e41}
  .white{fill:#fff}.soft{fill:#dbe4ff}.small{font-size:25px;fill:#455375}.name{font-size:32px;font-weight:700}
  .tag{font-size:20px;font-weight:700;letter-spacing:2px;fill:#2f43a8}.edge{fill:none;stroke:#2f43a8;stroke-width:4}
  .support{fill:none;stroke:#566689;stroke-width:4;stroke-dasharray:10 7}
</style>
