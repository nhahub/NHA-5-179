<g transform="translate(365 178)"><rect width="280" height="108" rx="15" fill="#fff"/><rect width="280" height="6" rx="3" fill="#2f43a8"/><text x="18" y="49" font-size="25" font-weight="700">Booking</text><text x="18" y="82" font-size="21" fill="#455375">Telegram · choose a slot</text></g>
<g transform="translate(660 178)"><rect width="280" height="108" rx="15" fill="#fff"/><rect width="280" height="6" rx="3" fill="#2f43a8"/><text x="18" y="49" font-size="25" font-weight="700">Check-in and visit</text><text x="18" y="82" font-size="21" fill="#455375">Care Board · staff roles</text></g>
<g transform="translate(955 178)"><rect width="280" height="108" rx="15" fill="#fff"/><rect width="280" height="6" rx="3" fill="#2f43a8"/><text x="18" y="49" font-size="25" font-weight="700">Follow-up and PDF</text><text x="18" y="82" font-size="21" fill="#455375">Care Board + Telegram</text></g>
<g transform="translate(1250 178)"><rect width="280" height="108" rx="15" fill="#fff"/><rect width="280" height="6" rx="3" fill="#2f43a8"/><text x="18" y="49" font-size="25" font-weight="700">Invoice and payment</text><text x="18" y="82" font-size="21" fill="#455375">n8n + Care Board</text></g>
